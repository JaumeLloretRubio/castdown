name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck (all workspaces)
        run: pnpm -r --if-present typecheck

      - name: Tests
        run: pnpm -r --if-present test -- --run

  python:
    name: markitdown-svc lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        working-directory: services/markitdown
        run: pip install -r requirements.txt
      - name: Compile check
        working-directory: services/markitdown
        run: python -m py_compile main.py

  docker:
    name: docker build matrix
    runs-on: ubuntu-latest
    needs: node
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: api,       context: ".", dockerfile: "services/api/Dockerfile" }
          - { name: pandoc,    context: ".", dockerfile: "services/pandoc/Dockerfile" }
          - { name: crawler,   context: ".", dockerfile: "services/crawler/Dockerfile" }
          - { name: web,       context: ".", dockerfile: "apps/web/Dockerfile" }
          - { name: markitdown,context: "services/markitdown", dockerfile: "services/markitdown/Dockerfile" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,scope=${{ matrix.target.name }},mode=max
          tags: castdown/${{ matrix.target.name }}:ci

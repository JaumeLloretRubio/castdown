<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<title>$title$</title>
<style>
  :root { --ink:#222; --bg:#fff; --accent:#2f4fbd; --mute:#666; --line:#e0e0e0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    max-width: 720px;
    margin-inline: auto;
    padding: 64px 24px 96px;
  }
  h1, h2, h3, h4 { font-weight: 700; line-height: 1.25; }
  h1 { font-size: 2.2em; margin-bottom: 0.4em; }
  h2 { font-size: 1.5em; margin-top: 1.8em; }
  h3 { font-size: 1.2em; margin-top: 1.4em; color: var(--mute); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  pre, code { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  pre {
    background: #f6f8fa;
    border-radius: 6px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 0.9em;
    line-height: 1.5;
  }
  code { background: #f6f8fa; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
  pre code { background: transparent; padding: 0; }
  blockquote {
    border-left: 3px solid var(--line);
    margin: 1.2em 0;
    padding: 0 1.2em;
    color: var(--mute);
    font-style: italic;
  }
  table { border-collapse: collapse; width: 100%; margin: 1.4em 0; font-size: 0.95em; }
  th, td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; }
  th { font-weight: 700; border-bottom: 2px solid var(--ink); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }
  img { max-width: 100%; height: auto; border-radius: 4px; }
</style>
</head>
<body>
$body$
</body>
</html>

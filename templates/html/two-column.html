<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<title>$title$</title>
<style>
  :root { --ink:#111; --bg:#fff; --accent:#0f4c81; --mute:#555; --line:#ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Libertinus Serif", "Linux Libertine", "Times New Roman", Georgia, serif;
    font-size: 10pt;
    line-height: 1.45;
    max-width: 1100px;
    margin-inline: auto;
    padding: 40px 30px 80px;
    column-count: 2;
    column-gap: 28px;
    text-align: justify;
    hyphens: auto;
  }
  h1, h2, h3, h4 {
    column-span: all;
    -webkit-column-span: all;
    text-align: left;
    font-weight: 700;
    line-height: 1.2;
  }
  h1 { font-size: 18pt; margin: 0 0 0.6em; text-align: center; }
  h2 {
    font-size: 11pt; margin-top: 1em;
    column-span: none; -webkit-column-span: none;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  h3 { font-size: 10pt; margin-top: 0.8em; column-span: none; font-style: italic; }
  p { margin: 0 0 0.5em; text-indent: 1em; }
  h1 + p, h2 + p, h3 + p { text-indent: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  pre, code { font-family: "Inconsolata", "Courier New", monospace; }
  pre {
    background: #f5f7fa; padding: 8px 10px; font-size: 8.5pt;
    border-left: 2px solid var(--accent); overflow-x: auto;
    text-align: left; text-indent: 0;
    break-inside: avoid; -webkit-column-break-inside: avoid;
  }
  code { font-size: 0.92em; color: var(--accent); }
  pre code { color: inherit; }
  blockquote {
    border-left: 2px solid var(--accent); margin: 0.8em 0;
    padding: 0 1em; font-style: italic; color: var(--mute);
    text-indent: 0; break-inside: avoid;
  }
  table {
    border-collapse: collapse; width: 100%; margin: 0.8em 0;
    font-size: 8.5pt;
    break-inside: avoid; -webkit-column-break-inside: avoid;
  }
  th, td { border: 0.3pt solid #888; padding: 4px 5px; text-align: left; }
  th { background: #e8edf3; font-weight: 700; }
  hr { border: 0; border-top: 0.3px solid var(--line); margin: 1.2em 0; }
  img { max-width: 100%; height: auto; }
  figure { break-inside: avoid; margin: 0.8em 0; text-align: center; }
  figcaption { font-size: 8.5pt; color: var(--mute); }
</style>
</head>
<body>
$body$
</body>
</html>

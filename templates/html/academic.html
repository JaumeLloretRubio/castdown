<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<title>$title$</title>
<style>
  :root { --ink:#111; --bg:#fff; --accent:#1a4dad; --mute:#555; --line:#ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Times New Roman", "Liberation Serif", "Charter", Georgia, serif;
    font-size: 12pt;
    line-height: 1.55;
    max-width: 740px;
    margin-inline: auto;
    padding: 60px 30px 100px;
    text-align: justify;
    hyphens: auto;
  }
  h1, h2, h3, h4 { font-weight: 700; line-height: 1.25; text-align: left; }
  h1 { font-size: 22pt; margin: 0 0 0.4em; text-align: center; }
  h2 { font-size: 14pt; margin-top: 1.6em; text-transform: uppercase; letter-spacing: 0.04em; }
  h3 { font-size: 12pt; margin-top: 1.3em; font-style: italic; }
  p { text-indent: 1.5em; margin: 0 0 0.6em; }
  p:first-of-type, h1 + p, h2 + p, h3 + p { text-indent: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  pre, code { font-family: "Courier New", monospace; }
  pre { background: #f6f6f6; padding: 10px 12px; overflow-x: auto; font-size: 10pt; border-left: 3px solid var(--accent); text-align: left; text-indent: 0; }
  code { font-size: 0.92em; background: #f6f6f6; padding: 1px 3px; }
  pre code { background: transparent; padding: 0; }
  blockquote { border-left: 3px solid var(--line); margin: 1.2em 0; padding: 0 1.2em; color: var(--mute); font-style: italic; text-indent: 0; }
  table { border-collapse: collapse; width: 100%; margin: 1.4em 0; font-size: 10.5pt; }
  th, td { border: 0.5pt solid #888; padding: 6px 8px; text-align: left; }
  th { background: #f0f0f0; font-weight: 700; }
  hr { border: 0; border-top: 0.5px solid var(--line); margin: 2em 0; }
  img { max-width: 100%; height: auto; }
  figure { text-align: center; margin: 1.4em 0; }
  figcaption { font-size: 10pt; color: var(--mute); margin-top: 0.4em; }
</style>
</head>
<body>
$body$
</body>
</html>

<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<title>$title$</title>
<style>
  :root { --ink:#0b0b0b; --bg:#f4f1e8; --red:#ff2e2e; --paper:#ebe7d8; --mute:#6b6b6b; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 14px;
    line-height: 1.6;
    max-width: 760px;
    margin-inline: auto;
    padding: 48px 24px 80px;
  }
  h1, h2, h3, h4 { letter-spacing: -0.01em; }
  h1 { font-size: 36px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  h2 { font-size: 22px; margin-top: 2em; }
  h3 { font-size: 16px; color: var(--red); }
  a { color: var(--red); }
  a:hover { background: var(--ink); color: var(--bg); text-decoration: none; }
  pre, code { font-family: inherit; }
  pre {
    background: var(--paper);
    border: 2px solid var(--ink);
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 13px;
  }
  code { background: var(--paper); padding: 1px 4px; }
  pre code { background: transparent; padding: 0; }
  blockquote {
    border-left: 4px solid var(--ink);
    margin: 1em 0;
    padding: 0 1em;
    color: var(--mute);
  }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  th, td { border: 2px solid var(--ink); padding: 8px 10px; text-align: left; }
  th { background: var(--ink); color: var(--bg); text-transform: uppercase; font-size: 12px; }
  hr { border: 0; border-top: 2px solid var(--ink); margin: 2em 0; }
  img { max-width: 100%; height: auto; border: 2px solid var(--ink); }
  ::selection { background: var(--ink); color: var(--bg); }
</style>
</head>
<body>
$body$
</body>
</html>
